# Inspired by the config used for lorax-built live media

set default="1"

function load_video {
	insmod efi_gop
	insmod efi_uga
	insmod video_bochs
	insmod video_cirrus
	insmod all_video
}
set basicgfx="nomodeset"

load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2

terminal_input console
terminal_output console

set timeout=10
set timeout_style=menu

search --file --set=root /boot/0xdddfcd5d

menuentry "Start Fedora-Xfce-Live" --class fedora --class gnu-linux --class gnu --class os {

        devicetree /holdsync.dtb
	linux ($root)/boot/aarch64/loader/linux root=live:CDLABEL=FEDORA-XFCE rd.live.image cpuidle.off=1 pd_ignore_unused clk_ignore_unused module_blacklist=drm,drm_kvm_helper,drm_display_helper,drm_aux_bridge,simpledrm,msm console=tty0 loglevel=8 ignore_loglevel rd.plymouth=0 plymouth.enable=0 systemd.mask=smartd.service rd.driver.blacklist=phy-qcom-qmp-pcie modprobe.blacklist=phy-qcom-qmp-pcie
	initrd ($root)/boot/aarch64/loader/initrd
}
menuentry "Test this media & start Fedora-Xfce-Live" --class fedora --class gnu-linux --class gnu --class os {
	linux ($root)/boot/aarch64/loader/linux quiet rhgb  root=live:CDLABEL=FEDORA-XFCE rd.live.image rd.live.check
	initrd ($root)/boot/aarch64/loader/initrd
}
submenu "Troubleshooting -->" {
	menuentry "Start Fedora-Xfce-Live in basic graphics mode" --class fedora --class gnu-linux --class gnu --class os {
		linux ($root)/boot/aarch64/loader/linux quiet rhgb  root=live:CDLABEL=FEDORA-XFCE rd.live.image ${basicgfx}
		initrd ($root)/boot/aarch64/loader/initrd
	}
}
