Section "ServerLayout"
	Identifier "NativeDPU"
	Screen 0 "DPUScreen"
EndSection

Section "Device"
    Identifier "QualcommDPU"
    Driver "modesetting"
    Option "AccelMethod" "glamor"
    BusID "platform:/sys/devices/platform/soc@0/ae00000.display-subsystem/ae01000.display-controller"
EndSection

Section "Screen" 
	Identifier "DPUScreen"
	Device "QualcommDPU"
EndSection
